# Configuração de email (SMTP via ssl - porta 465) 
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Diretorio para armazenamento local dos contratos para auditoria/suporte
app.contratos.diretorio=./contratos_historico/ 

# Configuração do H2 em arquivo (persistência local)
spring.datasource.url=jdbc:h2:file:./data/curadb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console no navegador (acesso via /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Permite o acesso ao console H2 de outros dispositivos na rede
spring.h2.console.settings.web-allow-others=true

# Modelo OpenRouter
openrouter.model=meta-llama/llama-3.1-8b-instruct