<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cura - Painel de Negociação</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background-color: #f4f4f9; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 30px; border-bottom: 1px solid #ddd; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Chat Central */
        .chat-section { flex: 2; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #ddd; padding: 20px; }
        .chat-box { flex: 1; border: 1px solid #eee; border-radius: 8px; padding: 15px; overflow-y: auto; background: #fafafa; margin-bottom: 15px; }
        .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
        .msg-user { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .msg-model { background: #e9ecef; color: #333; margin-right: auto; }
        .input-box { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-logout { background: #dc3545; }
        
        /* Histórico Lateral */
        .history-section { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; }
        .card-contrato { background: white; padding: 12px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 10px; font-size: 0.9em; }
        .card-contrato pre { white-space: pre-wrap; font-size: 0.85em; background: #f1f1f1; padding: 8px; border-radius: 4px; }
        .fechado-alert { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 10px; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h2>CURA - Gestão & IA</h2>
    <div>
        <span id="nome-usuario"></span>
        <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
</div>

<div class="main-container">
    
    <div class="chat-section">
        <h3>Negociação com o Agente</h3>
        <div id="alerta-fechamento" class="fechado-alert">
            <strong>Negócio Fechado!</strong> O contrato foi gravado no histórico.
        </div>
        <div id="chat-box" class="chat-box">
            <div class="msg msg-model">Olá! Sou o agente consultor do Cura. Qual a proposta de apresentação musical para hoje?</div>
        </div>
        <div class="input-box">
            <input type="text" id="mensagem-input" placeholder="Digite sua mensagem..." onkeypress="checarEnter(event)">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <div class="history-section">
        <h3>Seus Contratos Registrados</h3>
        <div id="lista-historico">Carregando...</div>
    </div>

</div>

<script>
    const usuarioId = localStorage.getItem('usuarioId');
    const usuarioNome = localStorage.getItem('usuarioNome');
    
    let historicoConversa = [];

    if (!usuarioId || usuarioId === 'undefined' || usuarioId === 'null') {
        window.location.href = '/login.html';
    } else {
        document.getElementById('nome-usuario').innerText = 'Usuário: ' + usuarioNome + ' | ';
        carregarHistorico();
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    function checarEnter(e) {
        if (e.key === 'Enter') enviarMensagem();
    }

    async function enviarMensagem() {
        const input = document.getElementById('mensagem-input');
        const texto = input.value.trim();
        if (!texto) return;

        const idArmazenado = localStorage.getItem('usuarioId');
        if (!idArmazenado || idArmazenado === 'undefined' || idArmazenado === 'null') {
            alert('Sessão expirada. Clique em Sair e faça login novamente.');
            window.location.href = '/login.html';
            return;
        }

        adicionarMensagemNaTela(texto, 'user');
        input.value = '';

        const payload = {
            usuarioId: Number(idArmazenado),
            mensagem: texto,
            quantidadeMusicos: 1,
            historico: historicoConversa
        };

        historicoConversa.push({ role: 'user', texto: texto });

        try {
            const response = await fetch('/api/agente/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const respostaTexto = await response.text();
            
            historicoConversa.push({ role: 'model', texto: respostaTexto });
            adicionarMensagemNaTela(respostaTexto, 'model');

            if (respostaTexto.includes('Negócio fechado!')) {
                document.getElementById('alerta-fechamento').style.display = 'block';
                salvarContratoAutomatico(respostaTexto);
            }

        } catch (error) {
            adicionarMensagemNaTela('Erro ao comunicar com o servidor.', 'model');
        }
    }

    function adicionarMensagemNaTela(texto, role) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg msg-${role}`;
        div.innerText = texto;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function salvarContratoAutomatico(textoAcordo) {
        try {
            await fetch(`/api/contratos/enviar?usuarioId=${usuarioId}&email=contratos@cura.com&estabelecimento=${encodeURIComponent(usuarioNome)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: textoAcordo
            });
            carregarHistorico();
        } catch (e) {
            console.error('Erro ao persistir contrato:', e);
        }
    }

    async function carregarHistorico() {
        const container = document.getElementById('lista-historico');
        try {
            const response = await fetch('/api/contratos/historico?usuarioId=' + usuarioId);
            const dados = await response.json();

            if (dados.length === 0) {
                container.innerHTML = '<p style="color:#777;">Nenhum contrato fechado.</p>';
                return;
            }

            container.innerHTML = '';
            dados.reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'card-contrato';
                const data = new Date(item.dataEnvio).toLocaleDateString('pt-BR');
                div.innerHTML = `
                    <strong>Data:</strong> ${data}<br>
                    <strong>Contratante:</strong> ${escapeHtml(item.estabelecimento)}
                    <pre>${escapeHtml(item.textoContrato)}</pre>
                `;
                container.appendChild(div);
            });
        } catch (error) {
            container.innerHTML = '<p style="color:red;">Erro ao carregar histórico.</p>';
        }
    }

    function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
</script>

</body>
</html>
