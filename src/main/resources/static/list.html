<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Negociação Artística</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Navegação principal */
        nav { display: flex; gap: 10px; margin-bottom: 20px; background: #1e293b; padding: 6px; border-radius: 8px; border: 1px solid #334155; }
        nav button { background: transparent; border: none; color: #94a3b8; padding: 10px 20px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        nav button.active { background-color: #2563eb; color: #ffffff; }

        /* Contêiner de painéis */
        .container { width: 100%; max-width: 800px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; height: 650px; }
        .tab-content { display: none; height: 100%; flex-direction: column; }
        .tab-content.active { display: flex; }

        /* Estilos do Painel do Contratante (Chat) */
        .header { background: #0f172a; padding: 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 1.1rem; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; }
        .user { align-self: flex-end; background-color: #2563eb; color: #ffffff; }
        .model { align-self: flex-start; background-color: #334155; color: #f8fafc; }
        .input-area { padding: 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; }
        input[type="text"], select { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
        input[type="text"] { flex: 1; }
        button.send-btn { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Estilos do Painel do Artista (Dashboard) */
        .dashboard { padding: 20px; overflow-y: auto; }
        .dashboard h3 { margin-bottom: 16px; color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        tr:hover { background: #334155; }
        .refresh-btn { background: #059669; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 15px; }
    </style>
</head>
<body>

    <nav>
        <button id="btn-contratante" class="active" onclick="alternarAba('contratante')">Painel Contratante (Negociação)</button>
        <button id="btn-artista" onclick="alternarAba('artista')">Painel Artista (Dashboard)</button>
    </nav>

    <div class="container">
        <!-- Aba Contratante -->
        <div id="tab-contratante" class="tab-content active">
            <div class="header">
                <h2>Negociação com Agente Comercial</h2>
                <select id="select-formacao">
                    <option value="1">Solo (1 músico - mínimo: R$ 400)</option>
                    <option value="2">Duo (2 músicos - mínimo: R$ 800)</option>
                    <option value="3" selected>Trio (3 músicos - mínimo: R$ 1.200)</option>
                </select>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="input-msg" placeholder="Digite sua proposta ou objeção..." onkeypress="tratarKeyPress(event)">
                <button class="send-btn" onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>

        <!-- Aba Artista -->
        <div id="tab-artista" class="tab-content">
            <div class="dashboard">
                <h3>Contratos Fechados via Agente IA</h3>
                <button class="refresh-btn" onclick="carregarContratos()">Atualizar Lista</button>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Contratante</th>
                            <th>Contratado</th>
                            <th>Valor Fechado</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-contratos">
                        <tr><td colspan="4" style="text-align:center;">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const historicoChat = [];

        function alternarAba(aba) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + aba).classList.add('active');
            document.getElementById('btn-' + aba).classList.add('active');

            if (aba === 'artista') {
                carregarContratos();
            }
        }

        async function enviarMensagem() {
            const input = document.getElementById('input-msg');
            const texto = input.value.trim();
            const qtdMusicos = document.getElementById('select-formacao').value;

            if (!texto) return;

            adicionarMensagemNoChat('user', texto);
            input.value = '';

            try {
                const response = await fetch('/api/agente/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mensagem: texto,
                        quantidadeMusicos: parseInt(qtdMusicos),
                        historico: historicoChat
                    })
                });

                const respostaTexto = await response.text();
                adicionarMensagemNoChat('model', respostaTexto);

                historicoChat.push({ role: 'user', texto: texto });
                historicoChat.push({ role: 'model', texto: respostaTexto });

            } catch (err) {
                adicionarMensagemNoChat('model', '[ERRO DE CONEXÃO]: Não foi possível enviar a mensagem.');
            }
        }

        function adicionarMensagemNoChat(role, texto) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerText = texto;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function tratarKeyPress(event) {
            if (event.key === 'Enter') enviarMensagem();
        }

        async function carregarContratos() {
    const tbody = document.getElementById('tabela-contratos');
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Buscando contratos...</td></tr>';

    try {
        const res = await fetch('/api/contratos');
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }
        const dados = await res.json();

        if (dados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum contrato fechado até o momento.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        dados.forEach(c => {
            const valorExibicao = c.valor ? c.valor.toFixed(2) : '0.00';
            const row = `<tr>
                <td>#${c.id}</td>
                <td>${c.contratante}</td>
                <td>${c.contratado}</td>
                <td>R$ ${valorExibicao}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#ef4444;">Erro ao carregar dados (${err.message}).</td></tr>`;
    }
}
    </script>
</body>
</html>
